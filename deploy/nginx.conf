# nginx site config for AutoDex
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/autodx.io
#          sudo ln -s /etc/nginx/sites-available/autodx.io /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx

# Rate limit zone: 10 req/s per IP
limit_req_zone $binary_remote_addr zone=autodex:10m rate=10r/s;

# upstream — app listens on port 3000 via systemd
upstream autodex_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name autodx.io www.autodx.io;

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name autodx.io www.autodx.io;

    # SSL certs managed by certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/autodx.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autodx.io/privkey.pem;

    # Modern TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Redirect www -> apex
    if ($host = www.autodx.io) {
        return 301 https://autodx.io$request_uri;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # App proxy
    location / {
        limit_req zone=autodex burst=20 nodelay;

        proxy_pass http://autodex_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets (not strictly needed, harmless)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Static assets — let nginx serve directly (Express also serves these as fallback)
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        alias /opt/autodex/public;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Cloudflare-style upload size limit for image uploads via Cloudinary
    client_max_body_size 10m;
}